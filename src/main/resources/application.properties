spring.application.name=authentication

spring.datasource.url=jdbc:mysql://${DB_URI}:${DB_PORT}/${DB_NAME}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Le secret doit contenir au moins 64 caractères
security.jwt.secret-key=${JWT_SECRET}

# 1h en millisecondes
security.jwt.expiration-time=3600000

#CORS
cors.allowedOrigins={$CORS_WHITE_LIST}

spring.security.user.name=disabled
spring.security.user.password=disabled

